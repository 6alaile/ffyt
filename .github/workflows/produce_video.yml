name: Produce Video

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Config filename (e.g. wc2026_ep01.json) from configs/'
        required: true
        default: 'wc2026_ep01.json'
      format:
        description: 'Output format: landscape (1920x1080) or portrait (1080x1920)'
        required: true
        default: 'landscape'
        type: choice
        options:
          - landscape
          - portrait

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── Node.js (required by HyperFrames) ───────────────────────
      # NOTE: no `cache: 'npm'` because this repo has no package.json —
      # we only use `npx --yes hyperframes`. setup-node's npm cache
      # requires a lockfile and will fail without one.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cache system fonts (restore only — saved by the post-step at job end)
      - name: Restore fonts cache
        uses: actions/cache@v4
        with:
          path: /usr/share/fonts/
          key: ${{ runner.os }}-fonts-dejavu
          restore-keys: |
            ${{ runner.os }}-fonts-          

      # ── System deps: FFmpeg + fonts ──────────────────────────────
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 \
            libasound2t64 libxss1 libgtk-3-0
        # The extra packages are headless Chrome deps needed by HyperFrames

      - name: Save fonts cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: /usr/share/fonts/
          key: ${{ runner.os }}-fonts-dejavu

      # ── Install Headless Browser System Dependencies ─────────────
      - name: Install Puppeteer System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm1 \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libasound2t64 \
            libxss1 \
            libxtst6
  
      # ── Python deps ──────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install requests tqdm pillow edge-tts

      # Install Puppeteer
      - name: Install Puppeteer
        run: npm i puppeteer
    
      # ── HyperFrames ─────────────────────────────────────────────
      - name: Install hyperframes puppeteer
        run: npx --yes hyperframes --version

      # ── Generate HTML composition ────────────────────────────────
      - name: Generate HTML from config
        run: |
          python scripts/generate_html.py \
            --config configs/${{ github.event.inputs.config }} \
            --format ${{ github.event.inputs.format }} \
            --output "$GITHUB_WORKSPACE/composition.html"

      - name: Verify composition file
        run: ls -la composition.html

      # Cache Pixabay downloads (video clips) — restore only.
      # `cache-hit` is true when a partial match is restored, so we still
      # call the fetch step and let it no-op via its built-in skip logic.
      - name: Restore media cache
        id: cache-media
        uses: actions/cache@v4
        with:
          path: assets/clips/
          key: ${{ runner.os }}-media-${{ hashFiles('configs/${{ github.event.inputs.config }}') }}-${{ github.event.inputs.format }}
          restore-keys: |
            ${{ runner.os }}-media-

      # ── Download clips ───────────────────────────────────────────
      - name: Download Pixabay clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python scripts/fetch_clips.py \
            --config configs/${{ github.event.inputs.config }} \
            --format ${{ github.event.inputs.format }} \
            --outdir assets/clips

      - name: Save media cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: assets/clips/
          key: ${{ runner.os }}-media-${{ hashFiles('configs/${{ github.event.inputs.config }}') }}-${{ github.event.inputs.format }}

      # ── Generate voiceover ───────────────────────────────────────
      - name: Restore voiceover cache
        id: cache-voiceover
        uses: actions/cache@v4
        with:
          path: assets/audio/full_voiceover.mp3
          key: ${{ runner.os }}-voiceover-${{ hashFiles(format('configs/{0}', github.event.inputs.config)) }}

      - name: Generate voiceover
        run: |
          python scripts/generate_voiceover.py \
            --config configs/${{ github.event.inputs.config }} \
            --output assets/audio/full_voiceover.mp3

      - name: Save voiceover cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: assets/audio/full_voiceover.mp3
          key: ${{ runner.os }}-voiceover-${{ hashFiles(format('configs/{0}', github.event.inputs.config)) }}

      # Debug Pre-Render State
      - name: Debug pre-render state
        run: |
          echo "PWD: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/composition.html" && echo "composition.html OK" || echo "composition.html MISSING"

      # ── Render via HyperFrames ───────────────────────────────────
      - name: Render video with HyperFrames
        run: |
          mkdir -p hf_input
          cp composition.html hf_input/index.html
          npx --yes hyperframes render hf_input --output output_raw.mp4

      # ── Upload to YouTube ────────────────────────────────────────
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload.py \
            --video "$GITHUB_WORKSPACE/output_raw.mp4" \
            --config configs/${{ github.event.inputs.config }}

      # ── Save rendered video as artifact ─────────────────────────
      - name: Upload rendered video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: ${{ github.workspace }}/output_raw.mp4
          retention-days: 7